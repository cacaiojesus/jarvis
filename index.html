<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<meta name="theme-color" content="#121214">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%235a5cff'/%3E%3Ccircle cx='20' cy='20' r='11' fill='none' stroke='white' stroke-opacity='.35' stroke-width='2'/%3E%3Cpath d='M20 9a11 11 0 0 1 11 11' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='20' cy='20' r='4.2' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f5f2; --card:#fff; --ink:#1c1c1e; --muted:#6e6e73; --line:#e6e4df;
  --accent:#2f5bea; --high:#d93a2b; --mid:#d98a00; --low:#2e9e5b; --ok:#2e9e5b; --chip:#efeee9;
  --pers:#f6f1ff; --persline:#e4d8ff; --persink:#7b4dff;
  --rot:#fff1f5; --rotline:#ffd2e0; --rotink:#e0457b; --today:#2f6bff; --work:#1c1c1e;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121214; --card:#1c1c1f; --ink:#f2f2f4; --muted:#9a9aa2; --line:#2c2c31;
         --accent:#6d8cff; --high:#ff6b5c; --mid:#ffb340; --low:#4cc480; --ok:#4cc480; --chip:#26262b;
         --pers:#221c30; --persline:#382c52; --persink:#a88bff;
         --rot:#2c1a22; --rotline:#4a2533; --rotink:#ff7aa5; --today:#5b8cff; --work:#f2f2f4; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{width:38px;height:38px;display:block}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:7px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.green{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600;font-size:13.5px;padding:7px 14px;border-radius:20px;transition:background .3s,transform .1s}
button.green:active{transform:scale(.94)}
button.green.reading{background:var(--today);border-color:var(--today);opacity:1}
button.green.reading::after{content:'';display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
button.green.err{background:var(--high);border-color:var(--high)}
button.green.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.08)}}
button:disabled{opacity:.5;cursor:default}
.new{display:flex;gap:8px;margin:20px 0 6px}
.field{flex:1;position:relative;display:flex}
.field textarea{flex:1;min-height:46px;resize:vertical;font:inherit;padding:11px 46px 11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.mic{position:absolute;right:7px;top:7px;width:32px;height:32px;padding:0;border-radius:50%;display:grid;place-items:center;border:none;background:transparent;color:var(--muted)}
.mic svg{width:18px;height:18px}
.mic.rec{background:var(--high);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--high) 25%,transparent)}}
.views{display:flex;gap:6px;margin:18px 0 0}
.views button{font-weight:600;padding:8px 18px}
.views button[data-v=hoje]{--c:var(--today)} .views button[data-v=geral]{--c:var(--ink)} .views button[data-v=entregues]{--c:var(--ok)}
.tabs{display:flex;gap:6px;margin:10px 0 4px;flex-wrap:wrap}
.tabs button{font-size:13px;padding:4px 11px}
.tabs button[data-v=trabalho]{--c:var(--work)} .tabs button[data-v=pessoal]{--c:var(--persink)}
.tabs button[data-v=rotina]{--c:var(--rotink)} .tabs button[data-v=entregues]{--c:var(--ok)}
.views button,.tabs button{color:var(--c);border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.views button.on,.tabs button.on{background:var(--c);border-color:var(--c);color:var(--bg)}
h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:24px 0 8px}
.task{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:8px 0;overflow:hidden}
.task.pessoal{background:var(--pers);border-color:var(--persline)}
.row{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;cursor:pointer}
.check{appearance:none;width:22px;height:22px;border:2px solid var(--muted);border-radius:50%;flex:none;margin:1px 0 0;cursor:pointer}
.check:checked{background:var(--ok);border-color:var(--ok);box-shadow:inset 0 0 0 3px var(--card)}
.main{flex:1;min-width:0}
.title{font-weight:600}
.done .title{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px;font-size:12.5px;color:var(--muted);align-items:center}
.chip{background:var(--chip);border-radius:6px;padding:1px 7px}
.task.pessoal .chip{background:var(--persline)}
.task.rotina{background:var(--rot);border-color:var(--rotline)} .task.rotina .chip{background:var(--rotline)}
.bar.rt{background:var(--rotink)}
.task.done:not(.open) .meta,.task.done:not(.open) .sent{display:none}
.task.done:not(.open) .row{padding-top:9px;padding-bottom:9px}
.task.done{opacity:.75}
.u1{color:var(--high);font-weight:600}.u2{color:var(--mid);font-weight:600}.u3{color:var(--low);font-weight:600}
.late{color:var(--high);font-weight:600}
.sent{font-size:11.5px;color:var(--muted);margin-top:2px;opacity:.8}
.bar{width:4px;align-self:stretch;border-radius:3px;flex:none}
.bar.u1{background:var(--high)}.bar.u2{background:var(--mid)}.bar.u3{background:var(--low)}
.time{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);min-width:44px;font-size:13.5px;margin-top:2px}
.edit{border-top:1px solid var(--line);padding:14px;display:none;gap:10px;grid-template-columns:1fr 1fr}
.task.pessoal .edit{border-color:var(--persline)}
.open .edit{display:grid}
.edit label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.edit .full{grid-column:1/-1}
.edit input,.edit select,.edit textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.edit textarea{min-height:70px;resize:vertical}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days label{flex-direction:row;align-items:center;gap:3px;background:var(--chip);border-radius:6px;padding:3px 7px;color:var(--ink)}
.links a{color:var(--accent);word-break:break-all;font-size:13px;display:block}
.actions{grid-column:1/-1;display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.lock{font-size:12px;color:var(--muted)}
.fold{padding:7px 10px}
.empty{color:var(--muted);padding:14px 2px}
.addrt{margin-top:10px}
footer{color:var(--muted);font-size:12px;text-align:center;margin-top:36px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;display:none;max-width:90vw;z-index:9}
@media (max-width:560px){.edit{grid-template-columns:1fr}.new{flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button id="syncBtn" class="green" title="Ler o WhatsApp agora">…</button>
    <svg class="logo" viewBox="0 0 40 40" aria-label="Jarvis"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a6cff"/><stop offset="1" stop-color="#7b4dff"/></linearGradient></defs><rect width="40" height="40" rx="11" fill="url(#lg)"/><circle cx="20" cy="20" r="11" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/><path d="M20 9a11 11 0 0 1 11 11" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><circle cx="20" cy="20" r="4.2" fill="#fff"/></svg>
  </header>

  <div class="new">
    <div class="field">
      <textarea id="newText" placeholder="Nova tarefa, do seu jeito. Ex.: “editar teaser CNX pro João até quinta 18h”"></textarea>
      <button class="mic" id="mic" title="Falar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    </div>
    <button class="primary" id="newBtn">Adicionar</button>
  </div>

  <div class="views"><button data-v="hoje" class="on">Hoje</button><button data-v="geral">Geral</button><button data-v="entregues">Entregues</button></div>
  <div class="tabs"><button data-v="trabalho">Trabalho</button><button data-v="pessoal">Pessoal</button><button data-v="rotina">Rotina</button></div>
  <div id="list"></div>
  <footer id="foot">—</footer>
</div>
<div class="toast" id="toast"></div>

<div id="login" hidden style="position:fixed;inset:0;background:var(--bg);z-index:20;display:grid;place-items:center;padding:24px">
  <form id="loginForm" style="width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;justify-content:center;margin-bottom:8px"><svg width="56" height="56" viewBox="0 0 40 40"><rect width="40" height="40" rx="11" fill="#5a5cff"/><circle cx="20" cy="20" r="11" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/><path d="M20 9a11 11 0 0 1 11 11" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><circle cx="20" cy="20" r="4.2" fill="#fff"/></svg></div>
    <input id="lEmail" type="email" placeholder="E-mail" autocomplete="username" required style="font:inherit;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)">
    <input id="lPass" type="password" placeholder="Senha" autocomplete="current-password" required style="font:inherit;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)">
    <button class="primary" type="submit">Entrar</button>
    <div id="lMsg" style="color:var(--muted);font-size:13px;text-align:center"></div>
  </form>
</div>
<script>
// ---------- um app só: no Mac fala com o servidor local; fora dele, com a nuvem ----------
const CONFIG = { url: 'https://quoslckleyrsrmfhqiqr.supabase.co', key: 'sb_publishable_5dT_aZOYF-aLCqcP2rYa_g_vEg5QfG2' };
const CLOUD = !['127.0.0.1','localhost'].includes(location.hostname) || location.search.includes('cloud');
let sb = null;
function localDate(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
async function sbReady(){
  if(sb) return sb;
  await new Promise((ok, no) => { const s=document.createElement('script'); s.src='supabase.min.js'; s.onload=ok; s.onerror=no; document.head.appendChild(s); });
  sb = window.supabase.createClient(CONFIG.url, CONFIG.key, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:false,
    lock: async (name, timeout, fn) => await fn()}});  // sem trava do navegador: no Safari do iPhone ela travava o login
  return sb;
}
function showLogin(){ document.getElementById('login').hidden=false; }
document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault(); const m=document.getElementById('lMsg'); m.textContent='Entrando…';
  try{
    const c = await sbReady();
    const res = await Promise.race([
      c.auth.signInWithPassword({email:document.getElementById('lEmail').value.trim().toLowerCase(), password:document.getElementById('lPass').value}),
      new Promise(ok => setTimeout(() => ok({timeout:true}), 15000))]);
    if(res.timeout){ const {data:{session}} = await c.auth.getSession(); if(!session){ m.textContent='A conexão demorou demais. Tente de novo.'; return; } }
    else if(res.error){ m.textContent = /invalid/i.test(res.error.message) ? 'E-mail ou senha incorretos.' : 'Erro: '+res.error.message; return; }
  }catch(err){ m.textContent='Não consegui conectar: '+(err && err.message || err); return; }
  document.getElementById('login').hidden=true; load();
});
async function q(p){ const {data, error} = await p; if(error){ const e=new Error(error.message); e.auth = /JWT|auth|permission|401|403/i.test(error.message+error.code); throw e; } return data; }
const nowIso = () => new Date().toISOString();
async function cloudApi(url, method, body){
  const c = await sbReady();
  const {data:{session}} = await c.auth.getSession();
  if(!session){ const e=new Error('login'); e.auth=true; throw e; }
  const today = localDate(), m = (re) => url.match(re);
  if(url==='/api/tasks' && method==='GET'){
    const since = new Date(Date.now()-7*864e5); const sinceD = since.toISOString().slice(0,10);
    const [tasks, rts, logs, plans, cmds] = await Promise.all([
      q(c.from('tasks').select('*').neq('status','deleted')),
      q(c.from('routines').select('*').eq('active',1).order('id')),
      q(c.from('routine_log').select('*').gte('date', sinceD)),
      q(c.from('today_plan').select('*').in('date',[today,'meta'])),
      q(c.from('commands').select('*').eq('status','pending').order('id'))]);
    const plan = (plans.find(p=>p.date===today)||{}).items || [];
    const meta = (plans.find(p=>p.date==='meta')||{}).items || {};
    const logT = Object.fromEntries(logs.filter(l=>l.date===today).map(l=>[l.routine_id,l]));
    const title = Object.fromEntries(rts.map(r=>[r.id,r.title]));
    PENDING = cmds;
    return { tasks: tasks.map(t=>({...t, links:t.links||[], locked:t.locked||[]})),
      routines: rts, date: today,
      today: plan.map(i=>{ const l=logT[i.routine_id]; return l ? {...i, done:!!l.done, time:l.time_override||i.time} : i; }),
      routine_done: logs.filter(l=>l.done).map(l=>({date:l.date, routine_id:l.routine_id, title:title[l.routine_id]||'Rotina'})).sort((a,b)=>b.date.localeCompare(a.date)),
      last_sync: meta.last_sync || null, syncing: cmds.some(x=>x.text==='/sync'), sync_msg: 'O Mac vai ler o WhatsApp' };
  }
  let r;
  if((r = m(/^\/api\/tasks\/(\d+)$/))){
    const b = {...body, updated_by:'phone', updated_at: nowIso()};
    if(body.status) b.done_at = body.status==='done' ? new Date().toISOString().slice(0,16).replace('T',' ') : null;
    await q(c.from('tasks').update(b).eq('id', +r[1])); return {task:null};
  }
  if((r = m(/^\/api\/routines\/(\d+)\/log$/))){
    const {date, ...rest} = body;
    await q(c.from('routine_log').upsert({routine_id:+r[1], date:date||today, ...rest, updated_by:'phone', updated_at: nowIso()})); return {ok:true};
  }
  if(url==='/api/tasks' && method==='POST'){ await q(c.from('commands').insert({text: body.text, source:'iphone'})); return {warn:'Enviado ✓ o Jarvis organiza em até 1 min'}; }
  if(url==='/api/sync'){ await q(c.from('commands').insert({text:'/sync', source:'iphone'})); return {ok:true}; }
  throw new Error('No iPhone, rotinas se editam pelo Mac.');
}
let PENDING = [];
if (CLOUD && 'serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch(e){} }
const U = {1:'Alta',2:'Média',3:'Baixa'};
const DIAS = ['dom','seg','ter','qua','qui','sex','sáb'];
const SEMANA = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom']; // 0=segunda (igual ao servidor)
let S = {tasks:[], routines:[], today:[], routine_done:[], date:''}, view='hoje', openId=null, syncing=false;

const $ = s => document.querySelector(s);
const esc = s => (s ?? '').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m, ms=3500){ const t=$('#toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none', ms); }
const today = () => S.date;
const dObj = d => new Date(d+'T12:00');
function dayDiff(d){ return Math.round((dObj(d)-dObj(today()))/864e5); }
function fmtDay(d){ const n=dayDiff(d); return n===0?'hoje':n===1?'amanhã':n===-1?'ontem':`${DIAS[dObj(d).getDay()]} ${d.slice(8)}/${d.slice(5,7)}`; }
function fmtDue(due){ if(!due) return ''; const [d,h]=due.split(' '); return fmtDay(d)+(h?' '+h:''); }
function fmtSent(ts){ const d=ts.slice(0,10); return `${fmtDay(d)} ${ts.slice(11,16)}`; }
function late(t){ if(!t.due||t.status!=='open') return false; const d=new Date(t.due.replace(' ','T')+(t.due.length===10?'T23:59':'')); return d<new Date(); }
// urgência pela data (a não ser que você tenha escolhido à mão)
function urg(t){
  if(t.locked.includes('urgency')) return t.urgency;
  if(!t.due) return 3;
  const n = dayDiff(t.due.slice(0,10));
  return n<=1 ? (n<=0||t.urgency===1 ? 1 : 2) : n<=3 ? 2 : 3;
}
function bucket(t){ if(!t.due) return 'Sem prazo'; const n=dayDiff(t.due.slice(0,10)); return n<=0?'Hoje':n<=7?'Próximos 7 dias':'Mais pra frente'; }
const byUrg = (a,b) => urg(a)-urg(b) || (a.due||'9999').localeCompare(b.due||'9999') || a.id-b.id;
const open = () => S.tasks.filter(t=>t.status==='open');

function render(){
  document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on', b.dataset.v===view));
  const L = $('#list'); let h = '';
  if(view==='hoje') h = renderToday();
  else if(view==='rotina') h = renderRoutines();
  else if(view==='entregues') h = renderDelivered();
  else {
    const arr = view==='geral' ? open() : open().filter(t=>(t.area||'trabalho')===view);
    if(!arr.length) h = '<div class="empty">Nada aqui. 🎉</div>';
    else for(const g of ['Hoje','Próximos 7 dias','Mais pra frente','Sem prazo']){
      const a = arr.filter(t=>bucket(t)===g).sort(byUrg);
      if(a.length) h += `<h2>${g} · ${a.length}</h2>` + a.map(t=>card(t)).join('');
    }
  }
  L.innerHTML = h;
}
function renderDelivered(){
  const tasks = S.tasks.filter(t=>t.status==='done').sort((a,b)=>(b.done_at||'').localeCompare(a.done_at||''));
  const rts = S.routine_done;
  if(!tasks.length && !rts.length) return '<div class="empty">Nada entregue ainda.</div>';
  const days = [...new Set([...tasks.map(t=>(t.done_at||'').slice(0,10)), ...rts.map(r=>r.date)])].sort().reverse();
  return days.map(d => `<h2>${fmtDay(d)} · ${d.slice(8)}/${d.slice(5,7)}</h2>` +
    rts.filter(r=>r.date===d).map(r=>rcard({routine_id:r.routine_id,title:r.title,done:true,area:'pessoal'}, d)).join('') +
    tasks.filter(t=>(t.done_at||'').slice(0,10)===d).map(t=>card(t)).join('')).join('');
}

// ---------- HOJE > FAZER: rotinas + tarefas do dia, por horário e urgência ----------
function renderToday(){
  const items = [];
  S.today.forEach(r => items.push({type:'r', r, done:r.done, key: r.all_day ? '00:00' : (r.time||'23:58'), u:0}));
  S.tasks.filter(t=>t.due && dayDiff(t.due.slice(0,10))<=0 && (t.status==='open' || (t.status==='done' && (t.done_at||'').slice(0,10)===today())))
    .forEach(t => items.push({type:'t', t, done:t.status==='done', key: dayDiff(t.due.slice(0,10))<0 ? '00:01' : (t.due.length>10 ? t.due.slice(11,16) : '23:59'), u:urg(t)}));
  items.sort((a,b)=> (a.done-b.done) || a.key.localeCompare(b.key) || a.u-b.u);
  if(!items.length) return '<div class="empty">Nada para hoje.</div>';
  return `<h2>${fmtDay(today())==='hoje' ? DIAS[dObj(today()).getDay()]+' '+today().slice(8)+'/'+today().slice(5,7) : ''} · ${items.length}</h2>` +
    items.map(i => i.type==='t' ? card(i.t) : rcard(i.r)).join('');
}
function rcard(r, date){
  const t = r.all_day ? 'dia todo' : r.time;
  const moved = r.moved ? `<div class="sent">↻ ajustado por causa de “${esc(r.moved)}”</div>` : '';
  return `<div class="task rotina ${r.done?'done':''}" data-rid="${r.routine_id}" data-date="${date||today()}">
    <div class="row" data-act="rtoggle"><span class="bar rt"></span>
      <input type="checkbox" class="check" data-act="rdone" ${r.done?'checked':''}>
      <div class="main"><div class="title">${esc(r.title)}</div>
        <div class="meta">${t?`<span class="time" style="min-width:0">${t}</span>`:''}<span class="chip">Rotina</span></div>${moved}</div>
    </div>
    ${openId==='r'+r.routine_id ? `<div class="edit" style="display:grid">
      <label>Hoje às<input type="time" name="ovr" value="${r.time||''}"></label>
      <div class="actions"><span class="lock">Muda só o horário de hoje</span>
      <span><button class="primary" data-act="rsaveToday">Salvar</button> <button class="fold" data-act="fold">▲</button></span></div></div>` : ''}
  </div>`;
}

// ---------- ROTINA ----------
function schedule(r){
  const d = r.days.length===7 ? 'Todo dia' : r.days.map(x=>SEMANA[x]).join(', ');
  if(r.all_day) return d+' · dia todo';
  if(r.flex) return `${d} · ${r.time} (se ajusta entre ${r.win_start} e ${r.win_end})`;
  return `${d} · ${r.time||'sem horário'}`;
}
function renderRoutines(){
  return S.routines.map(r => `<div class="task rotina ${openId==='R'+r.id?'open':''}" data-rrid="${r.id}">
    <div class="row" data-act="rrtoggle"><span class="bar rt"></span>
      <div class="main"><div class="title">${esc(r.title)}</div><div class="meta">${esc(schedule(r))}</div></div></div>
    <div class="edit">
      <label class="full">Nome<input name="title" value="${esc(r.title)}"></label>
      <label class="full">Dias<span class="days">${SEMANA.map((n,i)=>`<label><input type="checkbox" name="d${i}" ${r.days.includes(i)?'checked':''}>${n}</label>`).join('')}</span></label>
      <label>Horário<input type="time" name="time" value="${r.time||''}"></label>
      <label>Duração (min)<input type="number" name="duration" value="${r.duration||60}" min="5" step="5"></label>
      <label><span><input type="checkbox" name="all_day" ${r.all_day?'checked':''}> Dia todo</span></label>
      <label><span><input type="checkbox" name="flex" ${r.flex?'checked':''}> Flexível (se ajusta às entregas)</span></label>
      <label>Área<select name="area"><option value="pessoal" ${r.area==='pessoal'?'selected':''}>Pessoal</option><option value="trabalho" ${r.area==='trabalho'?'selected':''}>Trabalho</option></select></label>
      <div class="actions"><span></span><span><button data-act="rdel">Apagar</button> <button class="primary" data-act="rsave">Salvar</button> <button class="fold" data-act="fold">▲</button></span></div>
    </div></div>`).join('') + `<button class="addrt" data-act="radd">+ Nova rotina</button>`;
}

// ---------- CARD DE TAREFA ----------
function card(t){
  const u = urg(t);
  const NOMES={title:'título',kind:'tipo',area:'área',urgency:'urgência',client:'cliente',with_whom:'pessoa',due:'prazo',briefing:'briefing',refs:'referências',links:'links'};
  const locked = t.locked.includes('*') ? 'Criada por você — a rotina não altera' :
                 t.locked.length ? 'Você editou: ' + t.locked.map(k=>NOMES[k]||k).join(', ') + ' — protegido' : '';
  const sent = t.source==='manual' ? 'criada '+fmtSent(t.created_at) : t.source_time ? 'enviado '+fmtSent(t.source_time) : '';
  const dueVal = t.due ? (t.due.length===10 ? t.due+'T' : t.due.replace(' ','T')) : '';
  return `<div class="task ${t.area==='pessoal'?'pessoal':''} ${t.status==='done'?'done':''} ${openId===t.id?'open':''}" data-id="${t.id}">
    <div class="row" data-act="toggle">
      <span class="bar u${u}"></span>
      <input type="checkbox" class="check" data-act="done" ${t.status==='done'?'checked':''}>
      <div class="main">
        <div class="title">${t.kind==='compromisso'?'📅 ':''}${esc(t.title)}</div>
        <div class="meta">
          ${t.due?`<span class="${late(t)?'late':''}">${late(t)?'Atrasada · ':''}${fmtDue(t.due)}</span>`:''}
          <span class="u${u}">${U[u]}</span>
          ${t.client?`<span class="chip">${esc(t.client)}</span>`:''}
          ${t.with_whom?`<span>${esc(t.with_whom)}</span>`:''}
        </div>
        ${sent?`<div class="sent">${sent}</div>`:''}
      </div>
    </div>
    <div class="edit">
      <label class="full">O que entregar<input name="title" value="${esc(t.title)}"></label>
      <label>Tipo<select name="kind"><option value="tarefa" ${t.kind==='tarefa'?'selected':''}>Tarefa</option><option value="compromisso" ${t.kind==='compromisso'?'selected':''}>Compromisso</option></select></label>
      <label>Área<select name="area"><option value="trabalho" ${t.area!=='pessoal'?'selected':''}>Trabalho</option><option value="pessoal" ${t.area==='pessoal'?'selected':''}>Pessoal</option></select></label>
      <label>Cliente<input name="client" value="${esc(t.client)}"></label>
      <label>${t.kind==='compromisso'?'Com quem':'Quem pediu'}<input name="with_whom" value="${esc(t.with_whom)}"></label>
      <label>Prazo (dia)<input type="date" name="due_d" value="${dueVal.slice(0,10)}"></label>
      <label>Hora (opcional)<input type="time" name="due_h" value="${dueVal.slice(11,16)}"></label>
      <label>Urgência<select name="urgency"><option value="auto" ${t.locked.includes('urgency')?'':'selected'}>Automática (pela data)</option>${[1,2,3].map(x=>`<option value="${x}" ${t.locked.includes('urgency')&&t.urgency==x?'selected':''}>${U[x]}</option>`).join('')}</select></label>
      <label class="full">Briefing<textarea name="briefing">${esc(t.briefing)}</textarea></label>
      <label class="full">Referências<textarea name="refs" style="min-height:44px">${esc(t.refs)}</textarea></label>
      <label class="full">Links (um por linha)<textarea name="links" style="min-height:44px">${esc(t.links.join('\n'))}</textarea>
        <span class="links">${t.links.map(l=>`<a href="${esc(l)}" target="_blank" rel="noopener">${esc(l)}</a>`).join('')}</span></label>
      <div class="actions">
        <span class="lock">${locked?'🔒 '+locked:''}${t.source_chat?` <span style="opacity:.7">· ${esc(t.source_chat)}</span>`:''}</span>
        <span><button data-act="delete">Apagar</button> <button class="primary" data-act="save">Salvar</button> <button class="fold" data-act="fold" title="Recolher">▲</button></span>
      </div>
    </div>
  </div>`;
}

// ---------- DADOS ----------
async function load(){
  let j; try { j = await api('/api/tasks','GET'); } catch(e){ if(CLOUD && e.auth) return showLogin(); toast('Sem conexão: '+(e.message||e)); return; }
  Object.assign(S, j); syncing = j.syncing;
  $('#foot').textContent = j.syncing ? j.sync_msg : 'Última leitura: ' + (j.last_sync ? fmtSent(j.last_sync) : 'nunca');
  syncButton(j);
  const pend = PENDING.filter(x=>x.text!=='/sync');
  $('#foot').textContent += pend.length ? ` · ${pend.length} pedido(s) esperando o Mac` : '';
  render(); if(syncing) setTimeout(load, CLOUD ? 15000 : 2000);
}
const api = (url, method, body) => CLOUD ? cloudApi(url, method, body)
  : fetch(url, method==='GET' ? {} : {method, headers:{'Content-Type':'application/json'}, body: JSON.stringify(body||{})}).then(r=>r.json());

$('#list').addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act;
  if(act==='fold'){ openId=null; return render(); }
  if(act==='radd'){ const j=await api('/api/routines','POST',{title:'Nova rotina',days:[0,1,2,3,4,5,6],time:'08:00'}); openId='R'+j.id; return load(); }
  // rotina do dia
  const rbox = e.target.closest('[data-rid]');
  if(rbox){ const rid=+rbox.dataset.rid;
    if(act==='rdone'){ const d=rbox.dataset.date, on=el.checked;
      const it=S.today.find(x=>x.routine_id===rid); if(it && d===today()) it.done=on;
      if(on) S.routine_done.unshift({date:d,routine_id:rid,title:(it||{}).title}); else S.routine_done=S.routine_done.filter(x=>!(x.date===d&&x.routine_id===rid));
      render(); toast(on?'Feito ✓':'Desmarcado');
      await api(`/api/routines/${rid}/log`,'POST',{date:d,done:on?1:0}); return load(); }
    if(act==='rtoggle'){ if(e.target.closest('.check')) return; openId = openId==='r'+rid?null:'r'+rid; return render(); }
    if(act==='rsaveToday'){ const v=rbox.querySelector('[name=ovr]').value; await api(`/api/routines/${rid}/log`,'POST',{date:today(),time_override:v||null}); openId=null; toast('Horário de hoje ajustado'); return load(); }
  }
  // cadastro de rotinas
  const rr = e.target.closest('[data-rrid]');
  if(rr){ const id=+rr.dataset.rrid;
    if(act==='rrtoggle'){ openId = openId==='R'+id?null:'R'+id; return render(); }
    if(act==='rdel'){ if(!confirm('Apagar esta rotina?')) return; await api('/api/routines/'+id,'PATCH',{active:0}); openId=null; return load(); }
    if(act==='rsave'){ const q=n=>rr.querySelector(`[name=${n}]`);
      const days=[0,1,2,3,4,5,6].filter(i=>q('d'+i).checked);
      await api('/api/routines/'+id,'PATCH',{title:q('title').value,days,time:q('time').value||null,duration:+q('duration').value,
        all_day:q('all_day').checked?1:0,flex:q('flex').checked?1:0,area:q('area').value});
      openId=null; toast('Rotina salva'); return load(); }
  }
  // tarefas
  const box = e.target.closest('[data-id]'); if(!box) return;
  const id = +box.dataset.id; const t = S.tasks.find(x=>x.id===id);
  if(act==='done'){ const on=el.checked; t.status=on?'done':'open'; t.done_at=on?new Date().toISOString().slice(0,10)+' 00:00':null; openId=null; render();
    toast(on?'Entregue ✓':'Reaberta'); await api('/api/tasks/'+id,'PATCH',{status: on?'done':'open'}); return load(); }
  if(act==='toggle'){ if(e.target.closest('.check')) return; openId = openId===id ? null : id; return render(); }
  if(act==='delete'){ if(!confirm('Apagar esta tarefa? A rotina não vai recriá-la.')) return; await api('/api/tasks/'+id,'PATCH',{status:'deleted'}); openId=null; toast('Apagada'); return load(); }
  if(act==='save'){
    const f = {}; box.querySelectorAll('.edit [name]').forEach(i => f[i.name]=i.value);
    f.due = f.due_d ? (f.due_h ? f.due_d+' '+f.due_h : f.due_d) : null; delete f.due_d; delete f.due_h;
    f.links = f.links.split('\n').map(s=>s.trim()).filter(Boolean);
    const urgSel = f.urgency; delete f.urgency;
    const changed = {};
    for(const [k,v] of Object.entries(f)){
      const old = k==='links' ? t.links.join('\n') : (t[k] ?? '');
      const nv = k==='links' ? v.join('\n') : (v ?? '');
      if(String(old)!==String(nv)) changed[k]=v;
    }
    if(urgSel!=='auto' && (!t.locked.includes('urgency') || +urgSel!==t.urgency)) changed.urgency=+urgSel;
    if(!Object.keys(changed).length) return toast('Nada mudou');
    await api('/api/tasks/'+id,'PATCH',changed); toast('Salvo 🔒'); return load();
  }
});

// ---------- NOVA TAREFA + MICROFONE ----------
$('#newBtn').onclick = async () => {
  const text = $('#newText').value.trim(); if(!text) return;
  stopMic(); $('#newBtn').disabled = true; $('#newBtn').textContent = 'Organizando…';
  try{ const j = await api('/api/tasks','POST',{text}); $('#newText').value=''; toast(j.warn || 'Tarefa criada ✓', j.warn?7000:3500); }
  finally { $('#newBtn').disabled=false; $('#newBtn').textContent='Adicionar'; load(); }
};
$('#newText').addEventListener('keydown', e => { if(e.key==='Enter' && (e.metaKey||e.ctrlKey)) $('#newBtn').click(); });

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, base = '';
function stopMic(){ if(rec){ rec.stop(); } }
if(!SR) $('#mic').onclick = () => toast('Este navegador não tem ditado. Abra no Safari ou no Chrome — ou use o ditado do Mac (tecla 🎤 / Fn duas vezes).', 7000);
else $('#mic').onclick = () => {
  if(rec) return stopMic();
  rec = new SR(); rec.lang='pt-BR'; rec.continuous=true; rec.interimResults=true;
  base = $('#newText').value ? $('#newText').value.trimEnd()+' ' : '';
  rec.onresult = ev => { let fin='', tmp='';
    for(let i=0;i<ev.results.length;i++){ const r=ev.results[i]; (r.isFinal? (fin+=r[0].transcript) : (tmp+=r[0].transcript)); }
    $('#newText').value = base + fin + tmp; };
  rec.onerror = ev => { if(ev.error!=='no-speech') toast('Microfone: '+ev.error); };
  rec.onend = () => { rec=null; $('#mic').classList.remove('rec'); };
  rec.start(); $('#mic').classList.add('rec'); $('#newText').focus();
};

// ---------- botão do WhatsApp: frase muda todo dia ----------
const FRASES = ['Bora ver o zap 👀','Fazer o select do zap','Color grade nas demandas','Importar o dia','Ctrl+B nas mensagens',
 'Puxar a timeline do dia','Caçar task dos Majors','A Aline mandou algo?','Relinkar as demandas','Render do WhatsApp',
 'Proxy das mensagens','Flash + film click 📸','Garimpar os grupos','Keyframe no zap','Abrir o bin do dia',
 'Café + zap ☕','Quem pediu vídeo hoje?','Exportar o dia em H.264','Desembolar o WhatsApp','Pré-render do dia',
 'Ver o que vem em 4:5','Ler sem travar o Resolve','Sincronizar o caos','Abrir os 48 grupos 🫠','Bom dia, Jarvis. Lê aí',
 'Adobe Podcast nas tasks','Achar o TQ do dia','O que o Zé copiou?','Marcar os in/out do dia','Bater o ponto no zap'];
const PRONTO = ['Pronto ✓ tudo no bin','Lido ✓ timeline limpa','Pronto ✓ render ok','Lido ✓ pode respirar','Pronto ✓ zero offline media'];
function dayN(){ const d=new Date(); return Math.floor((d - new Date(d.getFullYear(),0,0))/864e5); }
let wasSyncing=false;
function syncButton(j){
  const b=$('#syncBtn'), n=dayN();
  b.classList.toggle('reading', !!j.syncing); b.classList.remove('err');
  if(j.syncing){ b.textContent='Lendo'; b.disabled=true; }
  else {
    b.disabled=false;
    const err = wasSyncing && (j.sync_msg||'').startsWith('Erro');
    if(err){ b.classList.add('err'); b.textContent='Deu ruim 😬'; toast(j.sync_msg, 8000); setTimeout(()=>load(), 4000); }
    else if(j.last_sync && j.last_sync.slice(0,10)===today()){ b.textContent = PRONTO[n % PRONTO.length] + ' ' + j.last_sync.slice(11,16); }
    else b.textContent = FRASES[n % FRASES.length];
    if(wasSyncing && !err){ b.classList.add('pop'); setTimeout(()=>b.classList.remove('pop'),600); toast(j.sync_msg||'Pronto'); }
  }
  wasSyncing = !!j.syncing;
}
$('#syncBtn').onclick = async () => { const b=$('#syncBtn'); b.classList.add('reading'); b.textContent='Lendo'; b.disabled=true; wasSyncing=true;
  await api('/api/sync','POST'); setTimeout(load, 600); };
document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { view=b.dataset.v; openId=null; render(); });
load(); setInterval(()=>{ if(!document.hidden && !syncing && openId===null) load(); }, 60000);
</script>
